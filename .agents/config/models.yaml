# Model Configuration — Centralized Fallback Chains
# Edit this file to change models for any role; all agents read from here.
# ⚠️ RULE: On every prompt involving CODE IMPLEMENTATION, the role-specific
#   model chain from your primary/fallbacks MUST be used. Not applicable when
#   preparing docs, asking simple questions, or planning (Phase 7, etc.).

# ─────────────────────────────────────────────────────────────────────────────
# ROLE: lead (orchestrator, architecture review, final approval)
# ─────────────────────────────────────────────────────────────────────────────
lead:
  primary: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
  fallbacks:
    - "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"   # Free ultra when available
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"       # Same model fallback

# ─────────────────────────────────────────────────────────────────────────────
# ROLE: worker (junior engineers — implementation)
# ─────────────────────────────────────────────────────────────────────────────
worker:
  primary: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
  fallbacks:
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"        # Same model, different instance
    - "nvidia/z-ai/glm-5.3-flash"                            # GLM as NVIDIA fallback only

# ─────────────────────────────────────────────────────────────────────────────
# ROLE: reviewer (PR review — NVIDIA models)
# ─────────────────────────────────────────────────────────────────────────────
reviewer:
  primary: "nvidia/z-ai/glm-5.3-flash"
  fallbacks:
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"  # Nano reasoning fallback

# ─────────────────────────────────────────────────────────────────────────────
# GLOBAL SETTINGS
# ─────────────────────────────────────────────────────────────────────────────
global:
  # Log file for all model fallbacks (JSONL)
  fallback_log: ".agents/logs/model-fallback.log"

  # Maximum fallback attempts per role (including primary = 1 + fallbacks.length)
  max_attempts_per_role: 4

  # Trigger conditions for fallback (any matching error/message)
  fallback_triggers:
    - "token limit"
    - "rate limit"
    - "429"
    - "503"
    - "context window"
    - "context length"
    - "maximum context"
    - "quota exceeded"

  # Co-author email domain (don't change unless GitHub changes it)
  coauthor_email_domain: "users.noreply.github.com"